<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (building(); as buildingRef) {
      <div>
        <h2 data-cy="buildingDetailsHeading"><span jhiTranslate="uniSchedulerApp.building.detail.title">Building</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ buildingRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="uniSchedulerApp.building.name">Name</span></dt>
          <dd>
            <span>{{ buildingRef.name }}</span>
          </dd>
          <dt><span jhiTranslate="uniSchedulerApp.building.code">Code</span></dt>
          <dd>
            <span>{{ buildingRef.code }}</span>
          </dd>
          <dt><span jhiTranslate="uniSchedulerApp.building.address">Address</span></dt>
          <dd>
            <span>{{ buildingRef.address }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/building', buildingRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
