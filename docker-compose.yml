name: unischeduler

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-UniScheduler}
      POSTGRES_USER: ${POSTGRES_USER:-UniScheduler}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: unischeduler-backend:local
    environment:
      _JAVA_OPTIONS: ${JAVA_OPTIONS:--Xmx768m -Xms256m}
      JAVA_OPTS: ${JAVA_OPTS:-}
      SPRING_PROFILES_ACTIVE: prod,api-docs,secret-samples
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: 'true'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-UniScheduler}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-UniScheduler}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-}
      SPRING_LIQUIBASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-UniScheduler}
      SPRING_LIQUIBASE_USER: ${POSTGRES_USER:-UniScheduler}
      SPRING_LIQUIBASE_PASSWORD: ${POSTGRES_PASSWORD:-}
      JHIPSTER_MAIL_BASE_URL: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /management/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3'"
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        PUBLIC_DEMO_URL: ${PUBLIC_DEMO_URL:-}
    image: unischeduler-frontend:local
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-4200}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
